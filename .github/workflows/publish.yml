name: publish twitch lists
# Every ~5 minutes (self-chained, see the chain job; the cron is a fallback; GitHub may run it later under load) and on demand: read the Worker's /export, build the small
# list files + thumbnail atlases and deploy them to GitHub Pages. Nothing is committed (keeps the repo small),
# except a once-a-day keepalive so GitHub does not pause the schedule after 60 quiet days.
# Uses the built-in GITHUB_TOKEN only.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==11.0.0
      - uses: actions/configure-pages@v5
        id: pages
      - name: build
        run: |
          curl -fsS --retry 3 --max-time 60 https://loft-twitch.theloft.workers.dev/export -o export.json
          mkdir -p out && cp site/index.html out/ && cp baked.json out/baked.json
          python tools/build_site.py export.json out "${{ steps.pages.outputs.base_url }}"
      - name: keepalive (once a day)
        run: |
          d=$(date -u +%F)
          if [ "$(cat keepalive.txt 2>/dev/null)" != "$d" ]; then
            echo "$d" > keepalive.txt
            git config user.name "loft-twitch bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keepalive.txt && git commit -m "keepalive $d" && git push || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
  # Self-chaining backup for the schedule (GitHub has not been running this repo's cron): after every run, wait,
  # then dispatch this workflow again with the built-in token. Only one chain survives: if another run of this
  # workflow is already queued/waiting/running, this one does not re-dispatch. Stop it by disabling the workflow
  # (gh workflow disable publish.yml) or setting the repo variable CHAIN=off.
  chain:
    needs: publish
    if: always() && vars.CHAIN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: wait
        run: sleep 240
      - name: re-dispatch unless another run is pending
        run: |
          others=$(gh run list --workflow publish.yml --limit 30 --json databaseId,status,createdAt \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != ${{ github.run_id }} and (.createdAt | fromdateiso8601) > (now - 3600))] | length")
          echo "other open runs: $others"
          if [ "$others" -gt 0 ]; then echo "another run is pending; it carries the chain"; exit 0; fi
          gh workflow run publish.yml --ref main
          echo "dispatched next run"
